

server:
  port: 8080
spring:
  data:
    redis:
      host: server.vinayakpaste.site
      port: 6379
      password: admin
  main:
    web-application-type: reactive
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: 1
          uri: http://localhost:8086
          predicates:
            - Path=/auth-sevrice/**
          filters:
            - StripPrefix=1
            - name: FixedWindowRateLimiterFilter
              args:
                maxRequests: 50
                window: 60
        - id: 2
          uri: http://localhost:8083
          predicates:
            - Path=/location-service/**
          filters:
            - StripPrefix=1
            - name: JwtAuthFilter
            - name: FixedWindowRateLimiterFilter
              args:
                maxRequests: 50
                window: 60



        #GraphQl config
        - id: trip-service
          uri: http://localhost:8085
          predicates:
              - Path=/trip-service/graphql/**
          filters:
            - StripPrefix=1
            - name: JwtAuthFilter
            - name: FixedWindowRateLimiterFilter
              args:
                maxRequests: 50
                window: 60



app:
  jwt:
    key: 


